name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # prisma.config.ts reads DATABASE_URL at load time, so `prisma generate`
      # needs one present even though it never connects. Nothing here is real.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      # Runs postinstall -> prisma generate, which is what produces
      # src/generated/prisma. That directory is no longer committed, so nothing
      # after this step would compile without it.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # `vite build` runs `tsc -b` first, so this covers typechecking too.
      - name: Build
        run: npm run build

  locales:
    name: Locale parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Catches the class of bug that shipped in e85f89d: a key present in one
      # locale and missing from the other, which i18next renders as the raw key.
      - name: Compare locale key sets
        run: node scripts/check-locales.mjs
